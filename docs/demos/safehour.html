<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="SafeHour의 복귀 시각별 일정 기능을 가상 데이터로 시연합니다.">
    <title>
      SafeHour 시연 · 고재천 프로덕트 포트폴리오
    </title>
    <link rel="stylesheet" href="../assets/style.css">
  </head>
  <body class="demo-page">
    <a class="skip" href="#demo">시연으로 건너뛰기</a>
    <header class="mast wrap">
      <a class="identity" href="../" aria-label="고재천 포트폴리오"><span class="monogram" aria-hidden="true"><i></i><i></i><i></i></span><b>고재천</b><span class="identity-role">플랫폼 PO</span></a>
      <nav aria-label="주 메뉴">
        <a href="../">제품 목록</a><a class="github" href="https://github.com/kojaecheon">GitHub</a>
      </nav>
    </header>
    <main id="demo" class="studio">
      <div class="wrap">
        <header class="studio-heading">
          <div>
            <p class="kicker" lang="en">
              SafeHour
            </p>
            <h1>
              복귀 시각별 일정 시연<span>.</span>
            </h1>
          </div>
          <p>
            가상 데이터를 사용하는 프로토타입입니다.
          </p>
        </header>
        <section class="demo-panel" aria-label="복귀 시각별 일정 조작 및 결과">
          <div class="controls">
            <h2>
              복귀 시각에 맞춰 일정 찾기
            </h2>
            <p>
              오후 2시에 출발합니다. 이동·체류 시간에 15분의 복귀 여유를 더해 가능한 일정을 계산합니다.
            </p><label for="deadline">병원 복귀 마감</label><select id="deadline">
              <option value="870">
                14:30
              </option>
              <option value="900">
                15:00
              </option>
              <option value="930" selected>
                15:30
              </option>
              <option value="960">
                16:00
              </option>
            </select>
            <fieldset>
              <legend>장소 조건</legend>
              <div class="checks">
                <label><input id="indoors" type="checkbox">실내 장소만 보기</label>
              </div>
            </fieldset>
          </div>
          <div class="result safe-result" aria-live="polite" aria-atomic="true">
            <div class="result-head">
              <b>가능한 일정</b><span id="safe-count"></span>
            </div>
            <div class="value">
              <span>출발부터 복귀 마감까지</span><strong id="safe-budget"></strong>
            </div>
            <div id="routes" class="result-list"></div>
          </div>
        </section>
      </div>
    </main>
    <footer class="foot wrap">
      <b>고재천 <span>플랫폼 PO</span></b><a href="../">제품 목록으로</a>
    </footer>
    <script src="../assets/demo-common.js"></script>
    <script src="../assets/safehour.js"></script>
  </body>
</html>
